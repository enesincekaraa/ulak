services:
  postgres:
    image: postgres:16-alpine
    container_name: ulak-postgres
    environment:
      POSTGRES_DB: ulak
      POSTGRES_USER: ulak
      POSTGRES_PASSWORD: ulak
    ports:
      - "5432:5432"
    volumes:
      - ulak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulak -d ulak"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ulak-pgdata: